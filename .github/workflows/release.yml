name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos
            arch: amd64
            runner: macos-13
            goos: darwin
            goarch: amd64
          - os: macos
            arch: arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-core/go.mod
          cache-dependency-path: go-core/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd go-core
          go build \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o ../bin/iskra \
            ./cmd/iskra/

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="iskra-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          cp README.md LICENSE.md bin/
          tar -czf "${ARCHIVE}" -C bin iskra README.md LICENSE.md
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iskra-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Iskra ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          body: |
            ## Installation

            **One-liner (recommended):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/NoamFav/Iskra/main/script/install.sh | bash
            ```

            **Manual download:**
            Pick the tarball for your platform below, then:
            ```bash
            tar -xzf iskra-*.tar.gz
            mv iskra ~/.local/bin/iskra
            chmod +x ~/.local/bin/iskra
            ```

            **From source (requires Go 1.21+):**
            ```bash
            git clone https://github.com/NoamFav/Iskra
            cd Iskra && bash script/install.sh
            ```

            ## Checksums
            See `checksums.txt` attached below.
