[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autocommit"
version = "0.1.0"
description = "Auto commit tool with bundled Go binary"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Noam F" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["auto_commit"]
include-package-data = true

[tool.setuptools.package-data]
auto_commit = ["bin/*"]

[project.scripts]
ai_commit = "auto_commit.ai_commit:main"
autocommit  = "auto_commit.auto_commit:main"
pull_repos  = "auto_commit.pull_repos:main"
